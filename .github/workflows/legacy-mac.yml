name: legacy-mac

# One-off build for old Intel Macs (macOS 10.13 - 10.14) on Electron 26. Runs only on pushes to the legacy-mac branch.
on:
  push:
    branches: [legacy-mac]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --mac --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: tunes-converter-legacy-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
